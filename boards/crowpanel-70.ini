[env:crowpanel-70]
extends = env_4mb
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.variant = crowpanel-70
board_build.partitions = custom_4Mb_full.csv

build_flags =
    ${env_4mb.build_flags}
    -Iinclude
    -std=gnu++17
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DCROWPANEL_70
    -DHAS_SCREEN=1
    -DROTATION=0
    -DFP=1
    -DFM=2
    -DFG=3
    -DHAS_BTN=0
    -DBTN_ALIAS='"Ok"'
    -DBTN_PIN=0
    -DTFT_WIDTH=800
    -DTFT_HEIGHT=480
    -DHAS_TOUCH
    -DSPI_SCK_PIN=12
    -DSPI_MOSI_PIN=11
    -DSPI_MISO_PIN=13
    -DSPI_SS_PIN=10
    -DDEVICE_NAME='"CrowPanel 7.0"'
    -DGROVE_SDA=19
    -DGROVE_SCL=20
    -DBAD_TX=43
    -DBAD_RX=44
    -DSERIAL_TX=43
    -DSERIAL_RX=44
    -DGPS_SERIAL_TX=43
    -DGPS_SERIAL_RX=44
    -DPIN_CLK=-1
    -DI2S_SCLK_PIN=-1
    -DPIN_DATA=-1
    -DI2S_DATA_PIN=-1
    -DBCLK=-1
    -DWCLK=-1
    -DDOUT=-1
    -DRGB_LED=-1

lib_deps =
    ${env_4mb.lib_deps}
    lovyan03/LovyanGFX@^1.1.16

; Same hardware as crowpanel-70, but with the reworked touch UI
; (tiled main menu, list menus, header/footer bars). The classic
; firmware above stays available unchanged.
[env:crowpanel-70-ui2]
extends = env:crowpanel-70
build_flags =
    ${env:crowpanel-70.build_flags}
    -DBRUCE_UI_MODERN
