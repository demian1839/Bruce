name: Build CrowPanel 7.0 Firmware

on:
  push:
    branches:
      - "main"
      - "master"
      - "add-elecrow-7-board-7334288356036986098"
  pull_request:
    branches:
      - "main"
      - "master"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: PlatformIO und Tools installieren
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: PlatformIO Core & Packages cachen
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini', '**/boards/crowpanel-70.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Firmware kompilieren
        run: |
          pio run -e crowpanel-70

      - name: Binaries zu einem Flash-Image zusammenfuegen (Merged Bin)
        run: |
          cd .pio/build/crowpanel-70
          python -m esptool --chip esp32s3 merge_bin \
            -o bruce_crowpanel70_merged.bin \
            --flash_mode dio \
            --flash_size 4MB \
            0x0 bootloader.bin \
            0x8000 partitions.bin \
            0x10000 firmware.bin
          ls -la

      - name: Firmware-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bruce-crowpanel70-firmware
          path: |
            .pio/build/crowpanel-70/firmware.bin
            .pio/build/crowpanel-70/bootloader.bin
            .pio/build/crowpanel-70/partitions.bin
            .pio/build/crowpanel-70/bruce_crowpanel70_merged.bin
          retention-days: 14
