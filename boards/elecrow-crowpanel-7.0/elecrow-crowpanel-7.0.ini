#################################### CrowPanel 7.0" HMI ##############################
; Elecrow CrowPanel 7.0" HMI (SKU DIS08070H)
; ESP32-S3, 800x480 RGB Panel, GT911 capacitive touch over I2C

[env:elecrow-crowpanel-70]
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_16Mb.csv
build_src_filter = ${env.build_src_filter} +<../boards/elecrow-crowpanel-7.0>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env.build_flags}
	-Iboards/elecrow-crowpanel-7.0
	-Os
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS

	-DELECROW

	; No RGB LED
	-DRGB_LED=-1

	; BadUSB on UART pins
	-DBAD_TX=43
	-DBAD_RX=44

	; Serial/GPS
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX

	; Buttons - touch only
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0

	; Font sizes
	-DFP=1
	-DFM=2
	-DFG=3

	; Screen
	-DHAS_SCREEN=1
	-DROTATION=1
	-DBACKLIGHT=2
	-DMINBRIGHT=10

	; Arduino_GFX: RGB panel
	-DUSE_ARDUINO_GFX=1
	-DTFT_DATABUS_N=3
	-DTFT_DISPLAY_DRIVER_N=49
	-DTFT_DE=41
	-DTFT_VSYNC=40
	-DTFT_HSYNC=39
	-DTFT_PCLK=0
	-DTFT_B0=15
	-DTFT_B1=7
	-DTFT_B2=6
	-DTFT_B3=5
	-DTFT_B4=4
	-DTFT_G0=9
	-DTFT_G1=46
	-DTFT_G2=3
	-DTFT_G3=8
	-DTFT_G4=16
	-DTFT_G5=1
	-DTFT_R0=14
	-DTFT_R1=21
	-DTFT_R2=47
	-DTFT_R3=48
	-DTFT_R4=45
	-DTFT_HSYNC_POL=0
	-DTFT_HSYNC_FRONT_PORCH=40
	-DTFT_HSYNC_PULSE_WIDTH=48
	-DTFT_HSYNC_BACK_PORCH=40
	-DTFT_VSYNC_POL=0
	-DTFT_VSYNC_FRONT_PORCH=1
	-DTFT_VSYNC_PULSE_WIDTH=31
	-DTFT_VSYNC_BACK_PORCH=13
	-DTFT_PCLK_ACTIVE_NEG=1
	-DTFT_PREF_SPEED=12000000
	-DTFT_WIDTH=800
	-DTFT_HEIGHT=480

	; Touch GT911 capacitive I2C
	-DHAS_TOUCH=1
	-DHAS_CAPACITIVE_TOUCH=1
	-DTOUCH_GT911_I2C=1
	-DGT911_SLAVE_ADDRESS_L=0x5D
	-D SYS_I2C_SDA=19
	-D SYS_I2C_SCL=20
	-DGT911_TOUCH_CONFIG_INT_GPIO_NUM=-1
	-DBOARD_TOUCH_INT=-1

	; SPI bus pin aliases (required by utils.cpp)
	-DSPI_SCK_PIN=-1
	-DSPI_MOSI_PIN=-1
	-DSPI_MISO_PIN=-1
	-DSPI_SS_PIN=-1

	; Backlight PWM
	-DTFT_BRIGHT_CHANNEL=7
	-DTFT_BRIGHT_Bits=8
	-DTFT_BRIGHT_FREQ=44100

	-DDEVICE_NAME='"Elecrow CrowPanel 7.0 HMI"'

lib_deps =
	${env.lib_deps}
	lewisxhe/SensorLib @ 0.3.4
	moononournation/GFX Library for Arduino @ ^1.5.5
################################## END CrowPanel 7.0" HMI #####################################
