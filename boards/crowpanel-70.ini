[env:crowpanel-70]
extends = env_4mb
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
; Zwingend DIO gegen den ets_loader-Crash beim 4MB N4R8
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 4MB

; Partitionstabelle von Bruce für 4MB-Geräte
board_build.partitions = partitions_4MB.csv

build_flags =
    ${env_4mb.build_flags}
    -std=gnu++17
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0
    -DUSE_LOVYANGFX
    -DCROWPANEL_70
    -DTFT_WIDTH=800
    -DTFT_HEIGHT=480
    -DHAS_TOUCH

lib_deps =
    ${env_4mb.lib_deps}
    lovyan03/LovyanGFX@^1.1.16
