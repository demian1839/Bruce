name: Build CrowPanel 7.0 (Classic + UI2) & CYD-2USB Firmware

on:
  push:
    branches:
      - "main"
      - "master"
      - "add-elecrow-7-board-7334288356036986098"
  pull_request:
    branches:
      - "main"
      - "master"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: PlatformIO und Tools installieren
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: PlatformIO Core & Packages cachen
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini', '**/boards/crowpanel-70.ini', '**/boards/CYD-2432S028/CYD-2432S028.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Firmware kompilieren (CrowPanel 7.0 Classic + UI2, CYD-2USB)
        run: |
          pio run -e crowpanel-70 -e crowpanel-70-ui2 -e CYD-2USB

      - name: Binaries zu Flash-Images zusammenfuegen (Merged Bin)
        run: |
          set -e
          # ESP32-S3 Boards: Bootloader @ 0x0 / ESP32 Boards: Bootloader @ 0x1000
          merge() {
            env_name="$1"; chip="$2"; boot_off="$3"; out_name="$4"
            build_dir=".pio/build/${env_name}"
            mkdir -p "${build_dir}"
            if [ -f "Bruce-${env_name}.bin" ]; then
              cp "Bruce-${env_name}.bin" "${build_dir}/${out_name}"
            elif [ -f "${build_dir}/firmware.bin" ]; then
              python -m esptool --chip "${chip}" merge_bin \
                -o "${build_dir}/${out_name}" \
                --flash_mode dio \
                --flash_size 4MB \
                "${boot_off}" "${build_dir}/bootloader.bin" \
                0x8000 "${build_dir}/partitions.bin" \
                0x10000 "${build_dir}/firmware.bin"
            else
              echo "::error::Kein Build-Ergebnis fuer ${env_name}"
              exit 1
            fi
          }

          merge crowpanel-70     esp32s3 0x0    bruce_crowpanel70_merged.bin
          merge crowpanel-70-ui2 esp32s3 0x0    bruce_crowpanel70_ui2_merged.bin
          merge CYD-2USB         esp32   0x1000 bruce_CYD2USB_merged.bin

      - name: CrowPanel 7.0 Artefakt hochladen (Classic UI)
        uses: actions/upload-artifact@v4
        with:
          name: bruce-crowpanel70-classic-firmware
          path: |
            .pio/build/crowpanel-70/firmware.bin
            .pio/build/crowpanel-70/bootloader.bin
            .pio/build/crowpanel-70/partitions.bin
            .pio/build/crowpanel-70/bruce_crowpanel70_merged.bin
          retention-days: 14

      - name: CrowPanel 7.0 Artefakt hochladen (UI2 / neue UI)
        uses: actions/upload-artifact@v4
        with:
          name: bruce-crowpanel70-ui2-firmware
          path: |
            .pio/build/crowpanel-70-ui2/firmware.bin
            .pio/build/crowpanel-70-ui2/bootloader.bin
            .pio/build/crowpanel-70-ui2/partitions.bin
            .pio/build/crowpanel-70-ui2/bruce_crowpanel70_ui2_merged.bin
          retention-days: 14

      - name: CYD-2USB Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: bruce-CYD-2USB-firmware
          path: |
            .pio/build/CYD-2USB/firmware.bin
            .pio/build/CYD-2USB/bootloader.bin
            .pio/build/CYD-2USB/partitions.bin
            .pio/build/CYD-2USB/bruce_CYD2USB_merged.bin
          retention-days: 14

      - name: Merged Bins als Release veroeffentlichen (crowpanel-latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: crowpanel-latest
          name: CrowPanel 7.0 - letzter CI Build
          body: |
            Automatischer Build von `${{ github.ref_name }}` (${{ github.sha }}).

            - `bruce_crowpanel70_merged.bin` - CrowPanel 7.0, klassische UI
            - `bruce_crowpanel70_ui2_merged.bin` - CrowPanel 7.0, neue UI
            - `bruce_CYD2USB_merged.bin` - CYD-2USB (unveraendert, klassische UI)

            Flashen: `esptool.py --chip esp32s3 write_flash 0x0 <datei>` (CYD: `--chip esp32`).
          prerelease: true
          files: |
            .pio/build/crowpanel-70/bruce_crowpanel70_merged.bin
            .pio/build/crowpanel-70-ui2/bruce_crowpanel70_ui2_merged.bin
            .pio/build/CYD-2USB/bruce_CYD2USB_merged.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
